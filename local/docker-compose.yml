name: ${COMPOSE_PROJECT_NAME:-mmcloud}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mattermost
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser-password
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 5s
      timeout: 5s
      retries: 20

  mattermost:
    # The Mattermost enterprise image is published for linux/amd64 only. Docker emulates it on Apple silicon.
    image: ${DEV_MATTERMOST_IMAGE:-mattermost/mattermost-enterprise-edition:12.0}
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mmuser-password@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: ${DEV_URL_MATTERMOST:-http://localhost:8065}
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEDEVELOPER: "true"
      MM_PLUGINSETTINGS_ENABLE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_PLUGINSETTINGS_AUTOMATICPREPACKAGEDPLUGINS: "false"
      MM_LOGSETTINGS_CONSOLELEVEL: DEBUG
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "false"
    volumes:
      - mm-config:/mattermost/config
      - mm-data:/mattermost/data
      - mm-plugins:/mattermost/plugins
      - mm-client-plugins:/mattermost/client/plugins

volumes:
  pg-data:
  mm-config:
  mm-data:
  mm-plugins:
  mm-client-plugins:
